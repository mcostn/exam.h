name: Build Compatibility

on:
  push:
  pull_request:

jobs:
  unix:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: gcc,   cxx: g++ }
          - { os: ubuntu-latest, cc: clang, cxx: clang++ }
          - { os: macos-latest,  cc: gcc,   cxx: g++ }
          - { os: macos-latest,  cc: clang, cxx: clang++ }

    steps:
      - uses: actions/checkout@v4
      - name: Build examples and tests
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: ./build.sh all

  tcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y tcc
      - name: Build tests with TCC
        env:
          CC: tcc
          CFLAGS: -I. -Wall
        run: ./build.sh tests

  msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build examples and tests
        shell: cmd
        run: build.bat all
